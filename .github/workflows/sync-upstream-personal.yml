name: Propose personal upstream sync

on:
  schedule:
    # 03:23 in mainland China (UTC+08:00).
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

jobs:
  propose-sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Propose upstream changes without executing them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --no-tags upstream master
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'No new upstream commits.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          open_pr=$(gh pr list --state open --base master --limit 100 \
            --json headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("codex/upstream-sync-")) | .url] | first // ""')
          if [ -n "$open_pr" ]; then
            echo "Review the existing upstream sync PR: $open_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          short_sha=$(git rev-parse --short=12 "$upstream_sha")
          branch="codex/upstream-sync-$short_sha-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-ff -m "Sync upstream master $short_sha [skip ci]" "$upstream_sha"; then
            echo 'Upstream changes conflict with this fork. Resolve the conflict manually; no branch was published.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push --set-upstream origin "$branch"

          cat > "$RUNNER_TEMP/upstream-sync-pr.md" <<EOF
          Bring the fork up to upstream commit \`$upstream_sha\`.

          Review **Files changed**, especially \`.github/workflows/\`, package manifests, and lockfiles. This PR does not build or run the upstream code. After you merge it into \`master\`, the personal Windows installer workflow starts automatically and uploads the unsigned EXE.
          EOF
          gh pr create --base master --head "$branch" \
            --title "Sync upstream master ($short_sha)" \
            --body-file "$RUNNER_TEMP/upstream-sync-pr.md"
